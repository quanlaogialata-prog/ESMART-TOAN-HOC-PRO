<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trung tâm ESMART</title>
    <meta name="description" content="Ứng dụng ôn tập và kiểm tra môn toán theo chương trình giáo dục phổ thông. Hỗ trợ quản lý lớp học, bài tập trắc nghiệm và tự luận, tính điểm tự động." />
    <meta property="og:title" content="Trung tâm ESMART" />
    <meta property="og:description" content="Ứng dụng ôn tập và kiểm tra môn toán theo chương trình giáo dục phổ thông. Hỗ trợ quản lý lớp học, bài tập trắc nghiệm và tự luận, tính điểm tự động." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="esmart" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Immediately unregister any old Service Workers so they never intercept requests or precache megabytes of assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister().catch(function(){});
          }
        }).catch(function(){});
      }
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"></noscript>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="stylesheet" href="/katex/katex.min.css" media="print" onload="this.media='all'">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f9fafb;
        color: #1e293b;
      }
      .esmart-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #f9fafb;
      }
      .esmart-shell-header {
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        padding: 16px 24px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .esmart-shell-brand {
        font-size: 20px;
        font-weight: 700;
        color: #2563eb;
        margin: 0;
        letter-spacing: -0.025em;
      }
      .esmart-shell-brand span {
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        margin-left: 8px;
      }
      .esmart-shell-tabs {
        display: flex;
        flex-wrap: wrap;
        background: #f3f4f6;
        padding: 4px;
        border-radius: 8px;
        gap: 4px;
      }
      .esmart-shell-tab {
        padding: 6px 16px;
        font-size: 14px;
        font-weight: 500;
        border-radius: 6px;
        color: #4b5563;
      }
      .esmart-shell-tab.active {
        background: #ffffff;
        color: #2563eb;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .esmart-shell-user {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 14px;
      }
      .esmart-shell-main {
        flex: 1;
        padding: 24px;
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
        box-sizing: border-box;
      }
      .esmart-shell-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="esmart-shell">
        <header class="esmart-shell-header">
          <h1 class="esmart-shell-brand">TRUNG TÂM ESMART <span>| ADMIN</span></h1>
          <div class="esmart-shell-tabs">
            <div class="esmart-shell-tab active">Quản lý</div>
            <div class="esmart-shell-tab">📚 Thư viện tài liệu</div>
            <div class="esmart-shell-tab">🎯 Bài ôn luyện theo chủ đề</div>
            <div class="esmart-shell-tab">Bài kiểm tra và thi online</div>
            <div class="esmart-shell-tab">Bài kiểm tra và thi offline</div>
            <div class="esmart-shell-tab">Chấm bài</div>
            <div class="esmart-shell-tab">Sổ kết quả</div>
          </div>
          <div class="esmart-shell-user">
            <span style="color:#374151;font-weight:500;">Thầy Kiên (Admin)</span>
            <span style="color:#4b5563;font-weight:600;">Cài đặt</span>
            <span style="color:#ef4444;font-weight:600;">Đăng xuất</span>
          </div>
        </header>
        <main class="esmart-shell-main">
          <div class="esmart-shell-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
              <div>
                <div style="font-size:20px;font-weight:700;color:#1f2937;">Quản lý Hệ thống</div>
                <div style="font-size:13px;color:#6b7280;margin-top:4px;">Quản lý giáo viên, học sinh và phân công lớp học</div>
              </div>
            </div>
            <div style="height:240px;background:#f9fafb;border-radius:8px;border:1px solid #f3f4f6;"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
