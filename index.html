<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trung tâm ESMART</title>
    <meta name="description" content="Ứng dụng ôn tập và kiểm tra môn toán theo chương trình giáo dục phổ thông. Hỗ trợ quản lý lớp học, bài tập trắc nghiệm và tự luận, tính điểm tự động." />
    <meta property="og:title" content="Trung tâm ESMART" />
    <meta property="og:description" content="Ứng dụng ôn tập và kiểm tra môn toán theo chương trình giáo dục phổ thông. Hỗ trợ quản lý lớp học, bài tập trắc nghiệm và tự luận, tính điểm tự động." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="esmart" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Fonts: Vietnamese diacritics optimized font (Be Vietnam Pro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      /* Instant baseline styling before css loads */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
      }
      .esmart-initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 20%, #eff6ff 0%, #f8fafc 100%);
        box-sizing: border-box;
      }
      .esmart-loader-card {
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 40px -15px rgba(37, 99, 235, 0.12), 0 0 0 1px rgba(226, 232, 240, 0.8);
        padding: 40px 32px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .esmart-loader-logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 28px;
        font-weight: 800;
        box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
      }
      .esmart-loader-title {
        font-size: 22px;
        font-weight: 800;
        color: #1e3a8a;
        margin: 0 0 8px 0;
        letter-spacing: -0.02em;
      }
      .esmart-loader-desc {
        font-size: 13px;
        color: #64748b;
        margin: 0 0 24px 0;
        line-height: 1.5;
      }
      .esmart-spinner {
        width: 32px;
        height: 32px;
        border: 3.5px solid #e2e8f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: esmart-spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        margin: 0 auto 12px;
      }
      .esmart-loader-status {
        font-size: 13px;
        font-weight: 600;
        color: #2563eb;
      }
      @keyframes esmart-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
      });
      // Safety timeout: nếu quá 5 giây mà chưa mount thì hiển thị nút khôi phục
      window.__esmartInitTimeout = setTimeout(function() {
        var statusEl = document.getElementById('esmart-status-text');
        var retryEl = document.getElementById('esmart-retry-btn');
        if (statusEl && retryEl) {
          statusEl.innerText = 'Đang thiết lập kết nối...';
          retryEl.style.display = 'inline-block';
        }
      }, 5000);
    </script>
    <div id="root">
      <div class="esmart-initial-loader">
        <div class="esmart-loader-card">
          <div class="esmart-loader-logo">E</div>
          <h1 class="esmart-loader-title">TRUNG TÂM ESMART</h1>
          <p class="esmart-loader-desc">Hệ thống Quản lý, Ôn tập & Kiểm tra Môn Toán</p>
          <div class="esmart-spinner"></div>
          <div id="esmart-status-text" class="esmart-loader-status">Đang mở ứng dụng...</div>
          <button id="esmart-retry-btn" onclick="try{localStorage.clear();}catch(e){}window.location.reload();" style="display:none; margin-top: 16px; padding: 8px 20px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">
            Tải lại ứng dụng
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
